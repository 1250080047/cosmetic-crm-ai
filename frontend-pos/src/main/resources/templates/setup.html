<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết lập cửa hàng · Cosmetic POS</title><link rel="stylesheet" href="/css/auth.css"></head>
<body><main class="auth-card"><p class="eyebrow">COSMETIC POS / THIẾT LẬP</p><h1>Quản trị viên đầu tiên</h1><p>Chỉ thực hiện tại máy chủ khi bảng users chưa có tài khoản. Hệ thống sẽ tạo ba vai trò và tài khoản của bạn trong cơ sở dữ liệu hiện tại.</p><p class="alert" th:if="${setupError}" th:text="${setupError}"></p>
<form th:action="@{/setup}" method="post"><label>Họ và tên<input name="fullName" maxlength="100" required autocomplete="name"></label><label>Tên đăng nhập<input name="username" pattern="[A-Za-z0-9_.\-]{3,50}" minlength="3" maxlength="50" required autocomplete="username"></label><label>Mật khẩu (ít nhất 10 ký tự)<input name="password" type="password" minlength="10" maxlength="72" required autocomplete="new-password"></label><button type="submit">Tạo quản trị viên</button></form><a href="/login">Về trang đăng nhập</a></main></body></html>
