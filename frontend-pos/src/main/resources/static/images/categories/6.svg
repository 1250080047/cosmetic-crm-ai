  <linearGradient id="ivory"><stop stop-color="#ded9c8"/><stop offset=".28" stop-color="#fffdf4"/><stop offset=".7" stop-color="#efebdd"/><stop offset="1" stop-color="#d4d0bc"/></linearGradient>
  <linearGradient id="rose"><stop stop-color="#b47c73"/><stop offset=".3" stop-color="#dfb1a1"/><stop offset=".7" stop-color="#cb998c"/><stop offset="1" stop-color="#a66d66"/></linearGradient>
