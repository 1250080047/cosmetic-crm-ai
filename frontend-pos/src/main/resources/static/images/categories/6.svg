  <linearGradient id="amber"><stop stop-color="#9f713b" stop-opacity=".85"/><stop offset=".35" stop-color="#dfba79" stop-opacity=".7"/><stop offset="1" stop-color="#b1864e" stop-opacity=".9"/></linearGradient>
  <linearGradient id="silver"><stop stop-color="#b6beb3"/><stop offset=".3" stop-color="#f2f3e9"/><stop offset=".7" stop-color="#d8ddd1"/><stop offset="1" stop-color="#9ba79c"/></linearGradient>
  <linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".65"/><stop offset=".45" stop-color="#f6f4e5" stop-opacity=".15"/><stop offset="1" stop-color="#a0ad95" stop-opacity=".6"/></linearGradient>
