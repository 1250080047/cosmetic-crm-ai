<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="title desc">
<title id="title">Dụng cụ làm đẹp</title><desc id="desc">Gương tròn viền đồng và cọ trang điểm với cán xanh sage. Hình minh họa nhóm hàng, không mô tả bao bì của sản phẩm cụ thể.</desc>
