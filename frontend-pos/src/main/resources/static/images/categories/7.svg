<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="title desc">
<title id="title">Phụ kiện &amp; thiết bị tóc</title><desc id="desc">Máy sấy xanh sage với chi tiết đồng và lược răng thưa màu ngà. Hình minh họa nhóm hàng, không mô tả bao bì của sản phẩm cụ thể.</desc>
