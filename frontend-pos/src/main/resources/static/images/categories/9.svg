<title id="title">Tắm &amp; chăm sóc cơ thể</title><desc id="desc">Chai sữa tắm màu ngà, xà phòng xanh sage và khăn vải gấp gọn. Hình minh họa nhóm hàng, không mô tả bao bì của sản phẩm cụ thể.</desc>
