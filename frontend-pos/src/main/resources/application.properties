spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cosmetic_crm_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Tài khoản SQL Server lấy từ backend-pos/.env (DB_USER, DB_PASSWORD) — file đó không đưa lên GitHub.
# Chạy Spring trong thư mục frontend-pos (mvn spring-boot:run) để đường dẫn ../backend-pos/.env đúng.
spring.config.import=optional:file:../backend-pos/.env[.properties]
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
ai.internal-key-file=${AI_INTERNAL_KEY_FILE:../.runtime/ai-internal.key}

# Cổng riêng cho trang thẻ khách khi mở ra Internet (scripts/public-member.cmd). Chỉ nhận kết nối từ chính máy này
# và chỉ mở trang /member; POS, trang quản trị, đăng nhập nhân viên không đi qua cổng này. Đặt -1 để tắt.
member.public-port=8081
# Địa chỉ cố định (VD https://the.cuahang.id.vn) nếu đã có tên miền; để trống thì tự lấy từ đường hầm hoặc Wi-Fi.
member.public-url=

# Tài khoản demo cho bảo vệ đồ án (mật khẩu 123456). Đặt false trước khi dùng thật.
app.demo-accounts.enabled=true
